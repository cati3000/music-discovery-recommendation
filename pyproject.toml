[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-discovery"
version = "0.1.0"
description = "Music clustering and content-based recommendation with Spotify audio features."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.18",
    "scikit-learn>=1.3",
]

[project.scripts]
music-discovery = "music_mining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
